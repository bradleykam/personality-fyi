<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Product overview · Personality.fyi</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>
:root{--paper:#f5f3ee;--ink:#202521;--muted:#667067;--line:#dce0d8;--green:#196947;--orange:#9c541c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:36px}h1{font-size:30px;letter-spacing:-1px;margin:6px 0}h2{font-size:21px;margin:0 0 6px}h3{font-size:15px;margin:0 0 8px}p{margin:6px 0 16px}.muted,small{color:var(--muted)}small{font-size:12px}header{display:flex;justify-content:space-between;gap:24px;align-items:start;margin-bottom:24px}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:1.6px;color:var(--green);font-weight:700}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}button{cursor:pointer}button.primary{background:var(--ink);color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px}.card .number{font-size:36px;font-weight:650;line-height:1.2;margin:10px 0}.card .number small{font-size:18px}.card p{font-size:12px;margin:0;color:var(--muted)}section{margin-top:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.two section{min-width:0}.notice{padding:14px 18px;border-left:3px solid var(--orange);background:#fff8ef;font-size:13px;margin:20px 0}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px 10px;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}.empty{padding:24px;color:var(--muted);font-size:14px}.bar{height:7px;background:#eef1eb;border-radius:5px;min-width:100px}.bar span{display:block;height:100%;background:var(--green);border-radius:5px}details{margin-top:18px}summary{cursor:pointer;color:var(--muted);font-size:13px}.hidden{display:none!important}.login{max-width:420px;margin:12vh auto;padding:30px;background:white;border:1px solid var(--line);border-radius:12px}.login input{width:100%;margin:8px 0}.error{color:#a33628;white-space:pre-wrap}.status{font-size:12px;color:var(--muted)}a{color:var(--green)}.metric-line{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line)}.metric-line:last-child{border:0}.metric-line strong{white-space:nowrap}.table-tools{display:flex;justify-content:space-between;gap:16px;margin-bottom:16px}.table-tools input{max-width:330px;width:100%}@media(max-width:850px){main{padding:20px}.cards{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}header{flex-direction:column}}@media(max-width:480px){.cards{grid-template-columns:1fr}.table-tools{flex-direction:column}}
#accounts .wrap{max-height:560px;overflow:auto}#accounts th{position:sticky;top:0;background:#fff;z-index:1}@media(max-width:700px){main{padding:16px}.cards{grid-template-columns:1fr 1fr;gap:10px}.card,section{padding:16px}.two{grid-template-columns:1fr}header,.table-tools{flex-direction:column}.table-tools input{width:100%;max-width:none}#accounts .wrap{max-height:none;overflow:visible}#accounts table,#accounts tbody,#accounts tr,#accounts td{display:block;width:100%}#accounts thead{display:none}#accounts tr{padding:12px;border:1px solid var(--line);border-radius:10px;margin:12px 0}#accounts td{display:flex;justify-content:space-between;gap:14px;padding:8px 0;overflow-wrap:anywhere}#accounts td::before{content:attr(data-label);font-weight:600;flex:0 0 45%;color:var(--muted)}#accounts td:first-child{display:block;font-weight:600}#accounts td:first-child::before{display:none}}
</style></head><body>
<div id="login" class="login hidden"><div class="eyebrow">Personality.fyi</div><h1>Admin sign in</h1><p class="muted">Use the admin account.</p><input id="email" type="email" value="brad@personality.fyi" aria-label="Admin email"><button id="send" class="primary">Email a sign-in code</button><div id="verify-box" class="hidden"><input id="code" inputmode="numeric" maxlength="6" placeholder="Six-digit code" aria-label="Sign-in code"><button id="verify" class="primary">Sign in</button></div><p id="auth-error" class="error" role="alert"></p></div>
<main id="dashboard" class="hidden"><header><div><div class="eyebrow">Personality.fyi · Product overview</div><h1>Are we earning repeat use?</h1><div id="asof" class="status"></div></div><div class="controls"><select id="period" aria-label="Reporting period"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select><button id="refresh">Refresh</button><button id="signout">Sign out</button></div></header>
<div id="load-error" class="notice hidden" role="alert"></div><div id="content"></div></main><div id="loading" class="login">Loading verified sources…</div>
<script>
const ADMIN='brad@personality.fyi';let sb,report;
const el=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=x=>x==null?'—':Number(x).toLocaleString(),date=x=>x?new Date(x).toLocaleString(undefined,{timeZone:'UTC',dateStyle:'medium',timeStyle:'short'})+' UTC':'Not recorded';
const ratio=r=>!r||r.pct==null?'Collecting data':r.pct+'% <small>('+n(r.n)+' / '+n(r.d)+')</small>';
function table(headers,rows){return rows.length?'<div class="wrap"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((c,i)=>'<td data-label="'+esc(headers[i])+'">'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<div class="empty">No recorded data for this period.</div>';}
function card(title,value,detail){return '<div class="card"><h3>'+esc(title)+'</h3><div class="number">'+value+'</div><p>'+esc(detail)+'</p></div>';}
function render(r){
 report=r;el('asof').textContent='Updated '+date(r.asOf)+' · excludes seed and internal accounts';
 const partial=new Date(r.coverage.since)>new Date(new Date(r.asOf)-r.days*86400000);
 let h='<div class="cards">'+card('New accounts',n(r.snapshot.newAccounts),'Confirmed signups in the selected period')+card('Accounts receiving AI answers',n(r.value.accounts),partial?'Recorded since the tracking update':'Distinct accounts in the selected period')+card('Received answers on 2+ days',n(r.value.repeatAccounts),'Same account received answers on separate UTC dates')+card('Paying subscribers',n(r.billing.paidAccounts),r.billing.available?'Current accounts verified against live Stripe':'Unavailable: Stripe could not be verified')+'</div>';
 h+='<div class="notice"><strong>Measurement starts '+esc(date(r.coverage.since))+'.</strong> '+esc(r.coverage.historical)+' Generated answers are a measurable value proxy, not proof of satisfaction.'+(r.billing.available?'':'<br><strong>'+esc(r.billing.reason)+'</strong>')+'</div>';
 h+='<div class="two"><section><h2>Where people need help next</h2><p class="muted">Current setup across '+n(r.snapshot.accounts)+' confirmed accounts. These groups sum to the account total; they are not funnel steps.</p>'+table(['Current state','Accounts'],r.snapshot.setup.map(x=>[esc(x.label),n(x.accounts)]))+'</section>';
 h+='<section><h2>Are answers becoming a habit?</h2><p class="muted">Only server-recorded answers count. A visit or an attempted question does not.</p><div class="metric-line"><span>New accounts receiving an answer within 7 days<br><small>Signup cohorts since the tracking update; '+n(r.value.firstWeekPending)+' still waiting for 7 days</small></span><strong>'+ratio(r.value.firstWeek)+'</strong></div><div class="metric-line"><span>Received another answer on a later day within 7 days<br><small>Accounts with a full 7 days since their first recorded answer</small></span><strong>'+ratio(r.value.repeatWeek)+'</strong></div><div class="metric-line"><span>Current paid share of confirmed accounts<br><small>Current status, not historical signup conversion</small></span><strong>'+(r.billing.available&&r.billing.conversion?ratio(r.billing.conversion):'Unavailable')+'</strong></div></section></div>';
 h+='<section><h2>Usage</h2><p class="muted">Activity in the selected period. Career and relationship setup are current totals. Seeds and internal accounts are excluded.</p>'+table(['Metric','Count'],[['Never Have I Ever answers saved',n(r.usage.nhieAnswered)],['Relationship questions asked',n(r.usage.relationshipQuestions)],['Career questions asked',n(r.usage.careerQuestions)],['Accounts with career added',n(r.usage.careerAccounts)],['Relationships currently saved',n(r.usage.relationshipsSaved)]])+'<p class="muted">'+(r.usage.questionsSince?'Questions asked are recorded from '+esc(date(r.usage.questionsSince))+', including requests that fail to produce an answer. Earlier questions are not reconstructed.':'Question-request tracking is awaiting its production start marker; counts are unavailable.')+' NHIE counts come from saved votes, one per account and question. They do not include seed votes or button clicks.</p></section>';
 h+='<section><h2>Where answers are delivered</h2><p class="muted">Selected period, limited to the tracking coverage above. Accounts can use more than one area.</p>'+table(['Area','Accounts','Answers generated','Accounts on 2+ days'],r.value.surfaces.map(x=>[esc(x.label),n(x.accounts),n(x.answers),n(x.repeatAccounts)]))+'<details><summary>Daily account activity and reliability</summary>'+table(['UTC date','Accounts receiving answers','Answers'],r.value.daily.slice().reverse().map(x=>[esc(x.day),n(x.accounts),n(x.answers)]))+'<p>'+n(r.value.failures)+' recorded AI failures. '+esc(Object.entries(r.value.failuresByStatus).map(([k,v])=>k+': '+v).join(' · '))+'</p><p class="muted">A dash means the date is outside tracking coverage. Zero means no event was recorded. Outcomes missing during a logging outage cannot be reconstructed.</p></details></section>';
 const campaigns={'life-set-type':'Set a type','life-add-relationship':'Add a relationship','life-add-career':'Add career context','life-relationship-question':'Ask about a relationship','life-person-verified':'Updated relationship','life-career-question':'Ask about work','life-career-next':'Next career decision','life-article':'Inactive: type article','life-lifestyle':'Inactive: lifestyle answers'};
 h+='<section><h2>Are emails producing useful action?</h2><p class="muted">Messages sent in the selected period, grouped by campaign and send week. Conversions require the recipient’s verified action during a tagged email visit, within 30 minutes. These are attributed actions, not proof the email caused them.</p>'+table(['Campaign / send week','Accepted','Delivered','Failed / bounced / suppressed','Set type','Relationship saved','Career saved','AI answer'],r.email.rows.map(x=>[esc(campaigns[x.campaign]||x.campaign)+'<br><small>'+esc(x.week)+'</small>',n(x.accepted),n(x.delivered),n(x.failed)+' / '+n(x.bounced)+' / '+n(x.suppressed),n(x.types),n(x.relationships),n(x.careers),n(x.answers)]));
 h+='<details><summary>Email delivery and measurement details</summary><p>Last recorded provider event: '+esc(date(r.email.lastWebhook))+'. Last lifecycle sweep: '+esc(date(r.email.lastRunAt))+'.</p>'+(r.email.lastRun?.error?'<p class="error">'+esc(r.email.lastRun.error)+'</p>':r.email.lastRun?'<p>Last sweep: '+n(r.email.lastRun.eligible)+' eligible, '+n(r.email.lastRun.accepted)+' accepted, '+n(r.email.lastRun.failed)+' failed, '+n(r.email.lastRun.deferred)+' deferred. '+(r.email.lastRun.dryRun?'Preview only.':'Sending enabled.')+'</p>':'<p>No lifecycle sweep recorded yet.</p>')+table(['Time','Outcome','Reason'],r.email.failures.map(x=>[esc(date(x.at)),esc(x.kind),esc(x.reason)]))+'<p class="muted">Accepted means Resend accepted the request; delivered means the recipient mail server accepted it, not inbox placement. Opens and clicks are omitted because scanners and privacy features distort them. Historical sends without message-level tracking are omitted. A zero is no recorded outcome, not proof of no engagement.</p></details></section>';
 h+='<details><summary>Email decision rules</summary><section><p>One useful next action per email. At least 3 days between lifecycle messages, no more than 2 in 7 days, and no routine follow-up within 24 hours of activity.</p>'+table(['Account state','Priority'],[['No type','Choose a type or take the test'],['Type, no life context','Add a relationship or career context'],['Relationship context','Ask about someone; then add another relationship'],['Career context','Ask about work; then explore the next decision'],['Inactive for 7+ days','A relevant article or real type-specific lifestyle answers, only after substantive follow-ups']])+'<p class="muted">Secondary content is at most one in four lifecycle touches and at least 14 days apart. Four unanswered follow-ups pause until activity changes. Unsubscribed, seed, and restricted-country accounts are excluded. Internal accounts are excluded unless explicitly opted into email; they remain excluded from reporting.</p></section></details>';
 h+='<section><div class="table-tools"><div><h2>Usage by account</h2><span class="muted">Saved NHIE answers across all time; questions since tracking began; setup as it stands today.</span></div><input id="account-search" placeholder="Search email or type" aria-label="Search accounts"></div><div id="accounts"></div><small>Deleted relationships are not included in the current saved count. A dash means unavailable, not zero.</small></section><details><summary>Sources and definitions</summary><ul>'+r.coverage.notes.map(x=>'<li>'+esc(x)+'</li>').join('')+'<li>'+esc(r.billing.source||r.billing.reason)+'</li><li>'+n(r.snapshot.excluded)+' accounts excluded from the snapshot.</li><li>Auth users and events are fully paginated; any core query failure stops the report instead of displaying partial totals.</li></ul></details>';
 el('content').innerHTML=h;el('account-search').oninput=renderAccounts;renderAccounts();
}
function renderAccounts(){const q=el('account-search').value.toLowerCase(),rows=report.accounts.filter(u=>(u.email+' '+u.type).toLowerCase().includes(q));el('accounts').innerHTML=table(['Account','Signup date (UTC)','Type','NHIE answered','Relationship questions asked','Career questions asked','Career added?','Relationships saved','Paid'],rows.map(u=>[esc(u.email),esc(u.signup ? new Date(u.signup).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}) : 'Unavailable'),esc(u.type||'Not set'),n(u.nhieAnswered),n(u.relationshipQuestions),n(u.careerQuestions),u.career?'Yes':'No',n(u.people),u.paid==null?'Unknown':u.paid?'Yes':'No']));}
async function load(){el('refresh').disabled=true;el('load-error').classList.add('hidden');el('content').innerHTML='Loading verified sources…';try{const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Sign in again.');const res=await fetch('/.netlify/functions/admin-analytics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessToken:session.access_token,version:3,days:Number(el('period').value)})});const r=await res.json();if(!res.ok)throw Error(r.error||'Could not verify sources.');render(r);}catch(e){el('content').innerHTML='';el('load-error').textContent='Report unavailable. '+e.message+' No partial totals are shown.';el('load-error').classList.remove('hidden');}finally{el('refresh').disabled=false;}}
function show(id){['login','dashboard','loading'].forEach(x=>el(x).classList.toggle('hidden',x!==id));}
el('send').onclick=async()=>{el('auth-error').textContent='';if(el('email').value.trim().toLowerCase()!==ADMIN){el('auth-error').textContent='Use the admin account.';return;}el('send').disabled=true;try{const {error}=await sb.auth.signInWithOtp({email:ADMIN,options:{shouldCreateUser:false}});if(error)throw error;el('verify-box').classList.remove('hidden');}catch(e){el('auth-error').textContent=e.message;}finally{el('send').disabled=false;}};
el('verify').onclick=async()=>{try{const {data,error}=await sb.auth.verifyOtp({email:ADMIN,token:el('code').value.trim(),type:'email'});if(error)throw error;if(data.user.email.toLowerCase()!==ADMIN)throw Error('Not authorized');show('dashboard');await load();}catch(e){el('auth-error').textContent=e.message;}};
el('refresh').onclick=load;el('period').onchange=load;el('signout').onclick=async()=>{await sb.auth.signOut();show('login');};
(async()=>{try{const cfg=await(await fetch('/.netlify/functions/config')).json();sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data:{session}}=await sb.auth.getSession();if(session?.user.email?.toLowerCase()===ADMIN){show('dashboard');await load();}else show('login');}catch(e){show('login');el('auth-error').textContent='Could not initialize sign-in. Refresh to retry.';}})();
</script></body></html>
